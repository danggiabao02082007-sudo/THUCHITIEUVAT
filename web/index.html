<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thu Chi Tiêu Vặt</title>
<meta name="description" content="Kế hoạch thu chi tiền tiêu vặt của tôi">
<meta name="theme-color" content="#C3B1FF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Thu Chi Tiêu Vặt">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ink:#2B2140; --muted:#6b6080; --green:#12B886; --red:#FA5252; --card:rgba(255,255,255,.9);
  --rainbow:linear-gradient(90deg,#FF5F9E,#FFA94D,#FFE066,#69DB7C,#4DABF7,#9775FA);
  --title:linear-gradient(90deg,#E64980,#F76707,#7048E8,#1C7ED6);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#B3E5FC;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(var(--sat) + 12px) 16px calc(var(--sab) + 120px)}
.card{position:relative;background:var(--card);border-radius:24px;padding:16px;margin-bottom:12px;
  box-shadow:0 8px 24px rgba(112,72,232,.18);border:2px solid transparent;
  background-image:linear-gradient(var(--card),var(--card)),var(--rainbow);background-origin:border-box;background-clip:padding-box,border-box}
.title{background:var(--title);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;margin:0}
h1.title{font-size:24px;line-height:1.15} h2.title{font-size:21px;margin-bottom:10px}
.header{display:flex;align-items:center;gap:10px}.header .tree{font-size:42px}
.sub{font-size:18px}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}
.pill-title{display:inline-block;color:#fff;font-weight:700;border-radius:99px;padding:6px 14px;margin:0 0 10px;
  background:linear-gradient(90deg,#7950F2,#E64980,#FD7E14)}
.circle{width:42px;height:42px;border-radius:50%;border:0;color:#fff;font-weight:800;font-size:16px;
  background:linear-gradient(135deg,#FF8FAB,#9775FA);cursor:pointer}
.center{text-align:center}.small{font-size:13px;color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}
.link{color:#7048E8;font-weight:700;background:none;border:0;font-size:14px;cursor:pointer;margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:18px;padding:12px;color:#fff}.tile b{display:block;font-size:13px}.tile span{font-size:19px;font-weight:800;white-space:nowrap}
.big{margin-top:10px;border-radius:18px;padding:14px;color:#fff}.big .v{font-size:31px;font-weight:800}
.progress{height:14px;border-radius:99px;background:rgba(0,0,0,.12);overflow:hidden;margin:4px 0}
.progress>div{height:100%;border-radius:99px}
.warn{color:var(--red);font-weight:700;font-size:13px}
.entry{display:flex;align-items:center;gap:10px;border-radius:18px;padding:10px;margin-bottom:8px;background:rgba(255,255,255,.95);cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.06)}
.ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none}
.entry .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;white-space:nowrap}.inc{color:var(--green)}.exp{color:var(--red)}
.daychip{display:inline-block;color:#fff;font-weight:800;background:rgba(81,45,168,.6);border-radius:99px;padding:4px 12px;margin:6px 0}
.pills{display:flex;gap:6px}.pill{flex:1;border-radius:99px;padding:9px 12px;font-weight:700;font-size:14px;border:1.5px solid #9775FA;
  background:rgba(255,255,255,.75);color:var(--ink);cursor:pointer}
.pill.on{color:#fff;border-color:transparent}
.btn{display:block;width:100%;border:0;border-radius:99px;padding:13px;font-size:16px;font-weight:800;color:#fff;cursor:pointer;margin-top:8px}
label.f{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
input,textarea{width:100%;font-size:16px;padding:11px 12px;border-radius:14px;border:1.5px solid #c9bfe6;background:#fff;color:var(--ink);font-family:inherit}
input:focus,textarea:focus{outline:2px solid #9775FA;border-color:transparent}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.quick button{border:0;border-radius:12px;padding:8px 0;color:#fff;font-weight:800;cursor:pointer}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cat{border-radius:14px;padding:6px 4px;text-align:center;border:1.5px solid;cursor:pointer;font-size:11px;font-weight:600;background:#fff}
.cat .e{font-size:20px;display:block}
.donutwrap{display:flex;gap:12px;align-items:center}
.legend div{font-size:12px;display:flex;align-items:center;gap:6px;margin:3px 0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.bars{display:flex;align-items:flex-end;height:120px;gap:8px}.bars div{flex:1;border-radius:8px 8px 4px 4px;min-height:4px}
.barl{display:flex;gap:8px}.barl span{flex:1;text-align:center;font-size:12px;font-weight:700}
.wk{display:flex;font-size:13px;padding:3px 0}.wk span{flex:1}
nav{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 8px);width:calc(100% - 24px);max-width:540px;
  display:flex;gap:4px;padding:6px;border-radius:28px;background:rgba(255,255,255,.94);box-shadow:0 8px 24px rgba(0,0,0,.18);
  border:2px solid transparent;background-image:linear-gradient(rgba(255,255,255,.94),rgba(255,255,255,.94)),var(--rainbow);background-origin:border-box;background-clip:padding-box,border-box}
nav button{flex:1;border:0;background:none;border-radius:22px;padding:6px 0;font-size:11px;font-weight:800;color:var(--ink);cursor:pointer}
nav button .e{display:block;font-size:21px}
nav button.on{color:#fff}
#fab{position:fixed;z-index:3;right:max(18px,calc(50% - 262px));bottom:calc(var(--sab) + 92px);width:66px;height:66px;border-radius:50%;
  border:3px solid #fff;color:#fff;font-size:40px;font-weight:800;line-height:1;cursor:pointer;
  background:conic-gradient(#FF5F9E,#FFA94D,#FFE066,#69DB7C,#4DABF7,#9775FA,#FF5F9E);box-shadow:0 8px 20px rgba(230,73,128,.45);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.modal{position:fixed;inset:0;z-index:10;background:rgba(43,33,64,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#FFFBFE;border-radius:28px 28px 0 0;padding:18px 18px calc(var(--sab) + 18px);
  animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.err{color:var(--red);font-weight:700;margin-top:8px}
.toast{position:fixed;z-index:20;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 14px);background:#2B2140;color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px}
.install{background:linear-gradient(90deg,#FFF3BF,#FFDEEB)}
@media (prefers-reduced-motion:reduce){#fab{animation:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main id="app"></main>
<button id="fab" aria-label="Thêm giao dịch">+</button>
<nav id="nav"></nav>
<div id="modal-root"></div>
<script src="app.js"></script>
</body>
</html>
